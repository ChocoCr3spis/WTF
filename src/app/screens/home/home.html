<form class="form" [formGroup]="configForm" (ngSubmit)="start()">
  <div class="title-block">
    <h1 class="logo">What's This Food?</h1>
    <p class="tagline">Guess the pixelated dish before anyone else!</p>
  </div>

  <div class="row">
    <div class="col-12 options">
      <p-selectbutton
        [options]="modes"
        formControlName="mode"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        aria-labelledby="mode"
      />
    </div>
  </div>

  <div class="row">
    <div class="col-12 field">
      <label>Difficulty</label>
      <p-selectbutton
        [options]="difficulties"
        formControlName="difficulty"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        aria-labelledby="difficulty"
      />
      <small class="hint">More difficulty = more pixelated &amp; more points per dish.</small>
    </div>
  </div>

  <div class="row">
    <div class="col-12 field">
      <label for="rounds">Rounds</label>
      <p-inputnumber
        inputId="rounds"
        formControlName="numberRounds"
        [showButtons]="true"
        buttonLayout="horizontal"
        spinnerMode="horizontal"
        [step]="1"
        [min]="1"
        [max]="50"
      />
    </div>
  </div>

  <div class="row two-cols">
    <div class="col-6 field">
      <label for="minSeconds">Min delay</label>
      <p-inputnumber
        inputId="minSeconds"
        formControlName="minSeconds"
        [showButtons]="true"
        buttonLayout="horizontal"
        spinnerMode="horizontal"
        suffix="s"
        [step]="1"
        [min]="0"
        [max]="29"
      />
    </div>
    <div class="col-6 field">
      <label for="maxSeconds">Max delay</label>
      <p-inputnumber
        inputId="maxSeconds"
        formControlName="maxSeconds"
        [showButtons]="true"
        buttonLayout="horizontal"
        spinnerMode="horizontal"
        suffix="s"
        [step]="1"
        [min]="1"
        [max]="30"
      />
    </div>
  </div>
  <small class="hint">The image appears after a random delay between min and max, so everyone can get ready.</small>

  <div class="bottom-form">
    <p-button
      label="Start"
      icon="pi pi-play"
      class="create-btn"
      type="submit"
      [disabled]="configForm.invalid"
    />
  </div>
</form>
