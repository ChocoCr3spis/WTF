<form [formGroup]="configForm" (ngSubmit)="saveConfig()">
  <div class="row">
    <div class="col-md-12 options">
      <p-selectbutton [options]="stateOptions" formControlName="visibility" optionLabel="label" optionValue="value" aria-labelledby="basic" (onChange)="changeValidator()"/>
    </div>
  </div>
  @if(!this.configFormControls['visibility'].value){
    <div class="row">
      <div class="col-md-6">
          <p-floatlabel variant="on">
              <p-iconfield>
                  <input type="text" pInputText formControlName="nombre"/>
                  <label for="on_label">Nombre</label>
              </p-iconfield>
          </p-floatlabel>
      </div>
      <div class="col-md-6">
        <p-floatlabel variant="on">
            <p-iconfield>
                <p-select [options]="genres" formControlName="genre" [showClear]="true"/>
                <label for="on_label">Genero</label>
            </p-iconfield>
        </p-floatlabel>
      </div>
    </div>
  }
  @else{
    <div class="row">
      <div class="col-md-4">
          <p-floatlabel variant="on">
              <p-iconfield>
                  <input type="text" pInputText formControlName="nombre"/>
                  <label for="on_label">Nombre</label>
              </p-iconfield>
          </p-floatlabel>
      </div>
      <div class="col-md-4">
        <p-floatlabel variant="on">
            <p-iconfield>
                <p-select [options]="genres" formControlName="genre" [showClear]="true"/>
                <label for="on_label">Genero</label>
            </p-iconfield>
        </p-floatlabel>
      </div>
      <div class="col-md-4">
        <p-floatlabel variant="on">
            <p-iconfield>
                <p-inputicon class="pi pi-key"/>
                <p-password formControlName="password" [toggleMask]="true" [feedback]="false" autocomplete="off" />
                <label for="on_label">Password</label>
            </p-iconfield>
        </p-floatlabel>
      </div>
    </div>
  }
  <div class="row">
    <div class="col-md-12">
      <p-iftalabel>
        <textarea pTextarea id="description" formControlName="description" rows="5" cols="30" style="resize: none"></textarea>
        <label for="description">Description</label>
      </p-iftalabel>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12 check-box-group">
      <div class="check-box">
        <p-checkbox formControlName="allowEmojis" inputId="size_normal" name="size" [binary]="true"/>
        <label for="size_normal">Permitir Emojis</label>
      </div>
      <div class="check-box">
        <p-checkbox formControlName="allowLinks" inputId="size_normal" name="size" [binary]="true" />
        <label for="size_normal">Permitir Links</label>
      </div>
    </div>
  </div>
  <div class="bottom-form">
    <p-button label="Crear" icon="pi pi-plus" styleClass="w-full mx-auto" type="submit" [disabled]="this.configForm.invalid"/>
  </div>
</form>
