name: Deploy to GitHub Pages

on:
  # Despliega en cada push a master
  push:
    branches: [master]
  # Permite lanzarlo manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos que necesita GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados; deja terminar el que esta en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # base-href = /nombre-del-repo/ (necesario para repos de proyecto)
      - name: Build
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      # Evita que GitHub Pages (Jekyll) ignore archivos que empiezan por _
      - name: Add .nojekyll
        run: touch dist/wtf/browser/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/wtf/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
